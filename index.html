<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>智行 · 医药代表工作台</title>
  <style>
    :root{--navy:#102b48;--blue:#1976e9;--line:#e8edf4;--ink:#182b41;--muted:#7d8c9e;--green:#19a775}
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
    .sidebar{position:fixed;z-index:8;width:252px;inset:0 auto 0 0;color:#cfdeeb;background:linear-gradient(180deg,#153c61,#0b2744 62%,#092039);padding:24px 12px 18px;overflow-y:auto;transition:transform .25s ease}
    .brand{display:flex;align-items:center;gap:10px;padding:0 12px 24px;color:#fff;font-size:17px;font-weight:700}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#3dc5ff,#2673f1);box-shadow:0 5px 13px #061d36}.brand-mark:after{content:"✦";font-size:19px}
    .user{display:flex;gap:9px;align-items:center;padding:12px;margin:0 5px 18px;border-radius:12px;background:#ffffff10;cursor:pointer}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f5b547;color:#754900;font-weight:800}.user b{display:block;color:#fff;font-size:13px}.user small{color:#94b3cb;font-size:11px}

    main{width:calc(100% - 252px);margin-left:252px;min-width:0}.topbar{height:74px;display:flex;align-items:center;gap:18px;padding:0 34px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.mobile-menu{display:none}.crumb{font-size:18px;font-weight:700}.crumb span{font-size:13px;font-weight:400;color:#91a0b0;margin-left:10px}.search{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:260px;padding:9px 12px;border:1px solid #e1e8f0;border-radius:9px;color:#93a1b0}.search input{border:0;outline:0;width:100%;color:#30445c}.top-avatar{width:32px;height:32px;border-radius:50%;background:#e3eef9;display:grid;place-items:center;color:#3a71a5;font-weight:700}
    .content{max-width:1460px;margin:auto;padding:28px 34px 42px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.welcome h1{font-size:25px;letter-spacing:-.04em;margin:0 0 4px}.welcome p{margin:0;color:var(--muted)}.date{color:#6d7e92;font-size:13px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px #29476b08}.stat{padding:18px 19px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:88px;height:88px;right:-27px;bottom:-35px;border-radius:50%;background:var(--tint)}.stat-title{display:flex;align-items:center;gap:7px;color:#6a7d92;font-size:13px}.stat-icon{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--tint);color:var(--accent)}.number{margin:9px 0 3px;font-size:27px;font-weight:750;letter-spacing:-.05em}.number small{font-size:13px;font-weight:500;letter-spacing:0;color:#8392a2;margin-left:4px}.trend{font-size:12px;color:var(--accent)}
    .primary{grid-template-columns:1.14fr .86fr;margin-bottom:18px}.bottom{grid-template-columns:.97fr 1.03fr}.section{padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h2{margin:0;font-size:16px}.section-head a{color:#2784dc;text-decoration:none;font-size:13px;cursor:pointer}.today-list{display:grid}.task{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:13px 2px;border-top:1px solid #eff3f7}.task:first-child{border-top:0}.check{width:19px;height:19px;border:1.5px solid #b7c4d1;border-radius:50%;background:#fff}.check.done{background:#23ae81;border-color:#23ae81;color:#fff}.check.done:after{content:"✓";font-size:12px;margin-left:3px}.task b,.project-row b{display:block;font-size:13px;font-weight:600}.task p{margin:2px 0 0;color:#8b99a8;font-size:12px}.tag{padding:3px 7px;border-radius:5px;font-size:11px;white-space:nowrap}.tag.orange{background:#fff4df;color:#d38b19}.tag.red{background:#fff0ef;color:#df665b}.tag.blue{background:#eaf4ff;color:#367fc4}.tag.green{background:#e9f8f2;color:#25926e}
    .ai{background:linear-gradient(135deg,#173f68,#0c2744);color:#fff;position:relative;overflow:hidden}.ai:before{content:"";position:absolute;inset:auto -50px -80px auto;width:250px;height:250px;border-radius:50%;background:#47b2ff29}.ai .section-head{margin-bottom:12px}.ai h2{display:flex;gap:7px;align-items:center}.ai h2 span{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#49b0ff;color:#07325a;font-size:15px}.ai-intro{color:#b9d1e8;margin:0 0 12px;font-size:13px}.suggestion{position:relative;display:flex;align-items:flex-start;gap:10px;padding:11px 8px;border-top:1px solid #ffffff1a}.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;margin-top:6px;background:#ffbe55;box-shadow:0 0 0 4px #ffbe551c}.suggestion b{font-size:13px}.suggestion p{margin:2px 0 0;color:#b3c8da;font-size:12px}.ai button{position:relative;width:100%;margin-top:9px;padding:9px;border-radius:8px;background:#ffffff16;color:#dceeff;text-align:center}
    .project-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eff3f7}.project-row:first-child{border-top:0}.project-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#eaf4ff;font-size:18px}.project-row small{color:#8797a7}.progress{width:104px;height:6px;background:#edf1f5;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;border-radius:8px;background:#2789e6}.visit-head{display:flex;align-items:center;gap:14px;padding-bottom:13px;border-bottom:1px solid #edf2f6}.donut{width:74px;height:74px;flex:0 0 74px;border-radius:50%;background:conic-gradient(#2b8ce6 var(--pct),#e7eef4 0);display:grid;place-items:center}.donut:after{content:attr(data-label);width:55px;height:55px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:14px}.visit-head b{font-size:15px}.visit-head p{margin:4px 0 0;color:#7f8e9e;font-size:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;height:78px;padding-top:10px}.bar{height:var(--h);min-height:4px;background:#d8eafa;border-radius:5px 5px 2px 2px;position:relative}.bar.today{background:#2b8ce6}.bar span{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);color:#8493a3;font-size:10px}
    .page-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.page-title h1{font-size:23px;margin:0}.page-title p{margin:4px 0 0;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:8px;background:#1976e9;color:#fff;font-weight:600}.btn.secondary{background:#edf4fb;color:#375875}.btn.danger{background:#fff0ef;color:#d35e54}.btn.small{padding:6px 9px;font-size:12px}.record-list{display:grid;gap:10px}.record{padding:15px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.record-main{min-width:0}.record h3{font-size:15px;margin:0 0 5px}.record p{font-size:12px;color:#76879a;margin:3px 0}.record-actions{display:flex;gap:6px;flex-shrink:0}.record-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.empty{padding:34px 18px;text-align:center;color:#8493a3}.empty b{display:block;color:#52677d;margin-bottom:5px}.record-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.record-toolbar input,.record-toolbar select{border:1px solid #dfe7f0;border-radius:8px;padding:9px 11px;background:white;color:#33495f}.record-toolbar input{flex:1;min-width:120px}.small-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.small-stat{padding:16px}.small-stat span{color:var(--muted);font-size:12px}.small-stat b{display:block;font-size:23px;margin-top:5px}
    .quick{position:fixed;right:28px;bottom:29px;z-index:6;width:54px;height:54px;border-radius:50%;background:#1976e9;color:#fff;box-shadow:0 8px 22px #1976e965;font-size:29px;line-height:1}.backdrop{display:none}.toast{position:fixed;left:50%;bottom:28px;z-index:20;transform:translate(-50%,90px);padding:10px 15px;border-radius:9px;color:#fff;background:#203d59;box-shadow:0 8px 22px #10263b35;transition:.25s;font-size:13px}.toast.show{transform:translate(-50%,0)}
    .modal-backdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:#10263b75}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:min(90vh,820px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 22px 70px #061d3655}.modal-head{position:sticky;top:0;background:#fff;z-index:1;padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;font-size:18px}.close{width:32px;height:32px;border-radius:50%;background:#f0f4f8;color:#52677d;font-size:20px}.modal-form{padding:18px 20px 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#60758a;font-weight:600}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #dfe7f0;border-radius:8px;background:#fff;outline:none;color:#243a50}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6aa9e8;box-shadow:0 0 0 3px #1976e916}.field textarea{min-height:78px;resize:vertical}.field.checkbox{flex-direction:row;align-items:center}.field.checkbox input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.profile-link{cursor:pointer}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.primary,.bottom{grid-template-columns:1fr}.content{max-width:880px}}
    @media(max-width:700px){body{background:#f5f8fc}.sidebar{transform:translateX(-100%);box-shadow:8px 0 25px #05132247}.sidebar.open{transform:translateX(0)}.sidebar-footer{position:static;margin:26px 12px 0}.backdrop.open{display:block;position:fixed;inset:0;z-index:7;background:#07152455}.app,main{display:block}main{width:100%;margin:0}.topbar{height:59px;padding:0 16px;gap:11px}.mobile-menu{display:block;padding:5px;background:transparent;color:#2d4c6b;font-size:22px}.crumb{font-size:16px}.crumb span,.search{display:none}.top-avatar{margin-left:auto;width:30px;height:30px}.content{padding:19px 14px 86px}.welcome{display:block;margin-bottom:16px}.welcome h1{font-size:21px}.welcome p{font-size:12px}.date{margin-top:6px;font-size:12px}.stats{gap:10px;margin-bottom:12px}.stat{padding:14px}.stat-title{font-size:12px}.stat-icon{width:25px;height:25px}.number{font-size:24px;margin:6px 0 2px}.trend{font-size:11px}.grid{gap:12px}.primary,.bottom{margin-bottom:12px}.section{padding:16px}.section-head{margin-bottom:11px}.task{grid-template-columns:24px minmax(0,1fr) auto;gap:7px;padding:11px 0}.task b{font-size:12px}.tag{font-size:10px}.ai{order:-1}.quick{width:52px;height:52px;right:18px;bottom:18px}.project-row{grid-template-columns:38px 1fr 72px}.progress{width:68px}.week{height:66px}.visit-head{padding-bottom:9px}.page-title{align-items:flex-start}.page-title h1{font-size:20px}.page-title .btn{padding:8px 10px;font-size:12px}.record{padding:13px;display:block}.record-actions{margin-top:10px}.small-stats{gap:8px}.small-stat{padding:12px}.small-stat b{font-size:19px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.modal-backdrop{align-items:flex-end;padding:0}.modal{width:100%;max-height:92vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}.modal-head{padding:16px}.modal-form{padding:15px 16px 20px}.modal-actions .btn{flex:1}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark"></span>智行工作台</div>
      <div class="user profile-link" id="profileBtn"><span class="avatar" id="userAvatar">?</span><div><b id="userName">设置个人资料</b><small id="userRole">点击填写姓名与负责区域</small></div></div>
      <nav class="nav">
        <div class="menu-label">工作台</div>
        <button class="active" data-page="home"><span class="icon">⌂</span>首页工作台</button>
        <button data-page="tasks"><span class="icon">✓</span>今日待办 <span class="badge" id="taskBadge">0</span></button>
        <button data-page="calendar"><span class="icon">◫</span>日程日历</button>
        <div class="menu-label">业务管理</div>
        <button data-page="customers"><span class="icon">♙</span>客户档案 <span class="badge" id="customerBadge">0</span></button>
        <button data-page="projects"><span class="icon">▣</span>项目管理 <span class="badge" id="projectBadge">0</span></button>
        <button data-page="visits"><span class="icon">◉</span>拜访记录</button>
        <button data-page="tasksAll"><span class="icon">☑</span>任务中心</button>
        <div class="menu-label">数据与支持</div>
        <button data-page="reports"><span class="icon">▥</span>数据简报</button>
      </nav>
      <div class="sidebar-footer">数据保存在当前设备</div>
    </aside>
    <div class="backdrop" id="navBackdrop"></div>
    <main>
      <header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="crumb" id="pageTitle">首页工作台 <span>工作台 / 首页</span></div><label class="search">⌕ <input id="globalSearch" placeholder="搜索当前列表" /></label><div class="top-avatar" id="topAvatar">?</div></header>
      <div class="content" id="view"></div>
    </main>
    <button class="quick" id="quickBtn" aria-label="新增记录">+</button><div class="toast" id="toast"></div>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="关闭">×</button></header><form class="modal-form" id="recordForm"><div class="fields" id="formFields"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">取消</button><button class="btn" type="submit">保存</button></div></form></section></div>
  <script>
    const STORE_KEY='zhixing-medrep-workbench-v1';
    const emptyState={profile:{name:'',region:'',role:'医药代表'},customers:[],projects:[],visits:[],tasks:[]};
    let state; try{state=JSON.parse(localStorage.getItem(STORE_KEY))||structuredClone(emptyState)}catch{state=structuredClone(emptyState)}
    for(const key of Object.keys(emptyState)){if(!state[key])state[key]=Array.isArray(emptyState[key])?[]:{...emptyState[key]}}
    let currentPage='home',editing=null,formType=null;
    const $=s=>document.querySelector(s),localDate=(date=new Date())=>date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'),today=()=>localDate();
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const save=()=>localStorage.setItem(STORE_KEY,JSON.stringify(state));
    const toast=message=>{const t=$('#toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)};
    const daysAgo=date=>{if(!date)return null;return Math.floor((new Date(today()+'T00:00:00')-new Date(date+'T00:00:00'))/86400000)};
    const customerName=id=>state.customers.find(x=>x.id===id)?.name||'未关联客户';
    const projectName=id=>state.projects.find(x=>x.id===id)?.name||'未关联项目';
    const labels={home:'首页工作台',tasks:'今日待办',calendar:'日程日历',customers:'客户档案',projects:'项目管理',visits:'拜访记录',tasksAll:'任务中心',reports:'数据简报'};
    function updateProfile(){const p=state.profile||{};const letter=(p.name||'?').trim().slice(0,1);$('#userAvatar').textContent=letter;$('#topAvatar').textContent=letter;$('#userName').textContent=p.name||'设置个人资料';$('#userRole').textContent=[p.region,p.role].filter(Boolean).join(' · ')||'点击填写姓名与负责区域'}
    function setPage(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').innerHTML=escapeHtml(labels[page]||page)+' <span>工作台 / '+escapeHtml(labels[page]||page)+'</span>';$('#sidebar').classList.remove('open');$('#navBackdrop').classList.remove('open');$('#globalSearch').value='';render()}
    function pageHead(title,sub,actionLabel,actionType){return '<div class="page-title"><div><h1>'+title+'</h1><p>'+sub+'</p></div><button class="btn" data-add="'+actionType+'">＋ '+actionLabel+'</button></div>'}
    function empty(title,desc){return '<div class="card empty"><b>'+title+'</b>'+desc+'</div>'}
    function renderDashboard(){
      const openTasks=state.tasks.filter(t=>!t.done),todayTasks=openTasks.filter(t=>t.date===today()),weekStart=new Date();weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));weekStart.setHours(0,0,0,0);
      const visitsThisWeek=state.visits.filter(v=>v.date&&new Date(v.date+'T00:00:00')>=weekStart).length;
      const suggestions=[];
      openTasks.filter(t=>t.date&&t.date<today()).slice(0,2).forEach(t=>suggestions.push(['任务已逾期：'+t.title,'截止 '+t.date+'，可更新进度或完成状态。']));
      openTasks.filter(t=>t.date===today()).slice(0,2).forEach(t=>suggestions.push(['今日待办：'+t.title,t.description||'今天完成并记录处理结果。']));
      const nextWeek=new Date();nextWeek.setDate(nextWeek.getDate()+7);state.projects.filter(p=>p.dueDate&&p.dueDate>=today()&&p.dueDate<=localDate(nextWeek)&&p.status!=='已完成').slice(0,2).forEach(p=>suggestions.push(['项目节点临近：'+p.name,'计划日期 '+p.dueDate+(p.milestone?' · '+p.milestone:'' )]));
      state.customers.filter(c=>c.lastContact&&daysAgo(c.lastContact)>=21).slice(0,2).forEach(c=>suggestions.push([c.name+' 已有 '+daysAgo(c.lastContact)+' 天未联系','如有需要，可安排合规跟进并填写拜访记录。']));
      const suggestionHtml=suggestions.length?suggestions.slice(0,3).map((s,i)=>'<div class="suggestion"><span class="dot" style="background:'+['#ffbe55','#67cdfb','#b78cf5'][i]+'"></span><div><b>'+escapeHtml(s[0])+'</b><p>'+escapeHtml(s[1])+'</p></div></div>').join(''):'<div class="suggestion"><span class="dot"></span><div><b>录入业务数据后，这里会生成提醒</b><p>系统会根据任务日期、项目节点和客户联系时间提示待跟进事项。</p></div></div>';
      const upcoming=[...openTasks].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,4);
      const taskRows=upcoming.length?upcoming.map(t=>'<div class="task"><button class="check" data-done="'+t.id+'" aria-label="完成任务"></button><div><b>'+escapeHtml(t.title)+'</b><p>'+escapeHtml([t.date||'未设置日期',t.customerId?customerName(t.customerId):'',t.projectId?projectName(t.projectId):''].filter(Boolean).join(' · '))+'</p></div><span class="tag '+(t.priority==='高'?'red':t.date===today()?'orange':'blue')+'">'+escapeHtml(t.priority||'普通')+'</span></div>').join(''):empty('还没有待办','点击右上角「＋」录入任务，首页会展示最近事项。');
      const projects=state.projects.slice(0,3);const projectRows=projects.length?projects.map(p=>'<div class="project-row"><span class="project-icon">▣</span><div><b>'+escapeHtml(p.name)+'</b><small>'+escapeHtml((p.status||'进行中')+(p.milestone?' · '+p.milestone:''))+'</small></div><div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,Number(p.progress)||0))+'%"></i></div><small>'+Math.max(0,Math.min(100,Number(p.progress)||0))+'%</small></div></div>').join(''):empty('还没有项目','新增项目后会显示进度。');
      const pct=Math.min(100,Math.round(visitsThisWeek/24*100));const weekDays=['一','二','三','四','五','六','日'];const weekStartDate=new Date(weekStart);const bars=weekDays.map((d,i)=>{const day=new Date(weekStartDate);day.setDate(day.getDate()+i);const date=localDate(day);const count=state.visits.filter(v=>v.date===date).length;return '<div class="bar '+(date===today()?'today':'')+'" style="--h:'+Math.max(5,Math.min(100,count*18))+'%"><span>'+d+'</span></div>'}).join('');
      return '<section class="welcome"><div><h1>早上好，'+escapeHtml(state.profile.name||'欢迎使用工作台')+'</h1><p>当前设备保存 '+state.customers.length+' 位客户、'+openTasks.length+' 项未完成任务。</p></div><div class="date">'+new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'</div></section>'+
      '<section class="grid stats">'+[
        ['☑','待办任务',openTasks.length,'项','今日 '+todayTasks.length+' 项',' #2789e6','#eaf4ff'],
        ['♙','客户档案',state.customers.length,'位','由你录入的客户',' #ef9f25','#fff5e4'],
        ['▣','进行中项目',state.projects.filter(p=>p.status!=='已完成').length,'个','共 '+state.projects.length+' 个项目',' #19a775','#e8f8f2'],
        ['◎','本周拜访',visitsThisWeek,'次','本周累计记录',' #b76de2','#f6edff']
      ].map(s=>'<article class="card stat" style="--accent:'+s[5]+';--tint:'+s[6]+'"><div class="stat-title"><span class="stat-icon">'+s[0]+'</span>'+s[1]+'</div><div class="number">'+s[2]+' <small>'+s[3]+'</small></div><div class="trend">'+s[4]+'</div></article>').join('')+'</section>'+
      '<section class="grid primary"><article class="card section"><div class="section-head"><h2>待办事项</h2><a data-goto="tasks">查看全部 →</a></div><div class="today-list">'+taskRows+'</div></article>'+
      '<article class="card section ai"><div class="section-head"><h2><span>✦</span>智能工作提醒</h2><a data-goto="reports" style="color:#a9ddff">数据简报 →</a></div><p class="ai-intro">提醒根据你填写的任务、项目和客户联系时间生成。</p>'+suggestionHtml+'<button data-add="task">＋ 新增待办</button></article></section>'+
      '<section class="grid bottom"><article class="card section"><div class="section-head"><h2>项目进展</h2><a data-goto="projects">项目管理 →</a></div>'+projectRows+'</article>'+
      '<article class="card section"><div class="section-head"><h2>本周拜访</h2><a data-goto="visits">拜访记录 →</a></div><div class="visit-head"><div class="donut" style="--pct:'+pct+'%" data-label="'+pct+'%"></div><div><b>'+visitsThisWeek+' 次拜访记录</b><p>统计来自本周已填写的拜访记录。</p><p>本周目标按 24 次展示</p></div></div><div class="week">'+bars+'</div></article></section>';
    }
    function recordCard(title,details,meta,id,type){return '<article class="card record"><div class="record-main"><h3>'+escapeHtml(title)+'</h3>'+details.map(x=>x?'<p>'+escapeHtml(x)+'</p>':'').join('')+(meta&&meta.length?'<div class="record-meta">'+meta.map(x=>'<span class="tag blue">'+escapeHtml(x)+'</span>').join('')+'</div>':'')+'</div><div class="record-actions"><button class="btn secondary small" data-edit="'+type+':'+id+'">编辑</button><button class="btn danger small" data-delete="'+type+':'+id+'">删除</button></div></article>'}
    function renderTasks(all=false){const rows=state.tasks.filter(t=>all||t.date===today()||(!t.date&&!t.done)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return pageHead(all?'任务中心':'今日待办',all?'录入和维护跟进、项目阶段与日常工作任务。':'今天需要完成的工作安排。','新增任务','task')+'<div class="record-list">'+(rows.length?rows.map(t=>'<article class="card record"><button class="check '+(t.done?'done':'')+'" data-done="'+t.id+'" aria-label="切换完成状态"></button><div class="record-main"><h3>'+escapeHtml(t.title)+'</h3><p>'+escapeHtml([t.date||'未设置日期',t.customerId?customerName(t.customerId):'',t.projectId?projectName(t.projectId):'',t.description||''].filter(Boolean).join(' · '))+'</p><div class="record-meta"><span class="tag '+(t.done?'green':t.date&&t.date<today()?'red':'blue')+'">'+(t.done?'已完成':t.date&&t.date<today()?'已逾期':'待处理')+'</span><span class="tag orange">'+escapeHtml(t.priority||'普通优先级')+'</span></div></div><div class="record-actions"><button class="btn secondary small" data-edit="task:'+t.id+'">编辑</button><button class="btn danger small" data-delete="task:'+t.id+'">删除</button></div></article>').join(''):empty('暂无任务','使用「新增任务」填写要跟进的事项。'))+'</div>'}
    function renderCustomers(){const list=state.customers;return pageHead('客户档案','记录客户基础信息、授权工作联系方式和跟进情况。','新增客户','customer')+'<div class="record-toolbar"><input id="listFilter" placeholder="搜索姓名、机构或专业" /><span class="tag blue">'+list.length+' 位客户</span></div><div class="record-list" id="recordList">'+(list.length?list.map(c=>recordCard(c.name,[c.institution,c.department,c.specialty,c.contact?'工作联系方式：'+c.contact:'',c.owner?'负责人：'+c.owner:'',c.lastContact?'最近联系：'+c.lastContact:''],[c.type||'未分类'],c.id,'customer')).join(''):empty('还没有客户档案','点击「新增客户」，自行填写客户类型、姓名、机构、部门、专业领域及经授权保存的工作联系方式。'))+'</div>'}
    function renderProjects(){const list=state.projects;return pageHead('项目管理','跟进业务项目阶段、负责人、计划节点与完成进度。','新增项目','project')+'<div class="record-list">'+(list.length?list.map(p=>recordCard(p.name,[p.customerId?'关联客户：'+customerName(p.customerId):'',p.status||'进行中',p.dueDate?'计划日期：'+p.dueDate:'',p.milestone?'当前节点：'+p.milestone:'',p.notes],['进度 '+(p.progress||0)+'%'],p.id,'project')).join(''):empty('还没有项目','点击「新增项目」填写项目名称、关联客户、阶段与计划日期。'))+'</div>'}
    function renderVisits(){const list=[...state.visits].sort((a,b)=>(b.date||'').localeCompare(a.date||''));return pageHead('拜访记录','记录合规的工作拜访、沟通内容和后续跟进安排。','新增拜访','visit')+'<div class="record-list">'+(list.length?list.map(v=>recordCard((v.customerId?customerName(v.customerId):'客户待关联')+' · '+(v.date||'日期未填写'),[v.type||'工作拜访',v.summary?'沟通纪要：'+v.summary:'',v.approvedTopic?'讨论内容：'+v.approvedTopic:'',v.nextFollowUp?'后续安排：'+v.nextFollowUp:''],[v.compliant?'合规信息已确认':'待确认合规信息'],v.id,'visit')).join(''):empty('还没有拜访记录','点击「新增拜访」，填写客户、日期、沟通纪要及后续安排。'))+'</div>'}
    function renderCalendar(){const list=[...state.tasks].filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date));const groups={};list.forEach(t=>(groups[t.date]??=[]).push(t));return '<div class="page-title"><div><h1>日程日历</h1><p>按日期查看已录入的任务与安排。</p></div><button class="btn" data-add="task">＋ 新增安排</button></div><div class="record-list">'+(Object.keys(groups).length?Object.entries(groups).map(([date,tasks])=>'<article class="card section"><div class="section-head"><h2>'+escapeHtml(date)+'</h2><span class="tag blue">'+tasks.length+' 项</span></div>'+tasks.map(t=>'<div class="task"><button class="check '+(t.done?'done':'')+'" data-done="'+t.id+'"></button><div><b>'+escapeHtml(t.title)+'</b><p>'+escapeHtml([t.customerId?customerName(t.customerId):'',t.description||''].filter(Boolean).join(' · '))+'</p></div><span class="tag '+(t.done?'green':'orange')+'">'+(t.done?'完成':'待办')+'</span></div>').join('')+'</article>').join(''):empty('暂无日程安排','新建带日期的任务后，会显示在这里。'))+'</div>'}
    function renderReports(){const overdue=state.tasks.filter(t=>!t.done&&t.date&&t.date<today()).length;const uncontacted=state.customers.filter(c=>c.lastContact&&daysAgo(c.lastContact)>21).length;return '<div class="page-title"><div><h1>数据简报</h1><p>根据当前设备中由你填写的资料汇总。</p></div><div><button class="btn secondary" id="importBtn">导入备份</button> <button class="btn" id="exportBtn">导出备份</button><input type="file" id="importFile" accept="application/json" hidden></div></div><div class="small-stats"><article class="card small-stat"><span>客户档案</span><b>'+state.customers.length+'</b></article><article class="card small-stat"><span>进行中项目</span><b>'+state.projects.filter(p=>p.status!=='已完成').length+'</b></article><article class="card small-stat"><span>拜访记录</span><b>'+state.visits.length+'</b></article><article class="card small-stat"><span>未完成任务</span><b>'+state.tasks.filter(t=>!t.done).length+'</b></article><article class="card small-stat"><span>逾期任务</span><b>'+overdue+'</b></article><article class="card small-stat"><span>超过 21 天未联系</span><b>'+uncontacted+'</b></article></div><div class="card section"><h2 style="margin:0 0 8px;font-size:16px">数据与备份</h2><p style="color:#76879a;margin:0">资料保存在此浏览器的当前设备。更换设备或清理浏览器数据前，请先导出备份；导入备份会替换当前保存的数据。</p></div>'}
    function render(){updateProfile();$('#taskBadge').textContent=state.tasks.filter(t=>!t.done).length;$('#customerBadge').textContent=state.customers.length;$('#projectBadge').textContent=state.projects.filter(p=>p.status!=='已完成').length;const view=$('#view');view.innerHTML=currentPage==='home'?renderDashboard():currentPage==='tasks'?renderTasks(false):currentPage==='tasksAll'?renderTasks(true):currentPage==='customers'?renderCustomers():currentPage==='projects'?renderProjects():currentPage==='visits'?renderVisits():currentPage==='calendar'?renderCalendar():renderReports()}
    const field=(name,label,type='text',required=false,options=null,full=false,placeholder='')=>({name,label,type,required,options,full,placeholder});
    const configs={
      customer:{title:'客户档案',fields:[field('type','客户类型','select',true,['医生/医疗卫生专业人士','医院或医疗机构','药学部门','其他经授权联系人']),field('name','姓名 / 客户名称','text',true),field('institution','所属机构'),field('department','部门'),field('specialty','专业领域'),field('contact','工作联系方式（经授权）'),field('owner','负责人'),field('lastContact','最近联系日期','date'),field('notes','备注','textarea',false,null,true)]},
      project:{title:'业务项目',fields:[field('name','项目名称','text',true),field('customerId','关联客户','select',false,()=>state.customers.map(c=>[c.id,c.name])),field('status','项目状态','select',true,['筹备中','进行中','等待反馈','已完成']),field('progress','完成进度（%）','number',false),field('milestone','当前阶段 / 节点'),field('dueDate','计划日期','date'),field('notes','项目说明','textarea',false,null,true)]},
      task:{title:'待办任务',fields:[field('title','任务内容','text',true),field('date','计划日期','date',true),field('priority','优先级','select',true,['普通','高','低']),field('customerId','关联客户','select',false,()=>state.customers.map(c=>[c.id,c.name])),field('projectId','关联项目','select',false,()=>state.projects.map(p=>[p.id,p.name])),field('description','补充说明','textarea',false,null,true)]},
      visit:{title:'拜访记录',fields:[field('customerId','拜访客户','select',true,()=>state.customers.map(c=>[c.id,c.name])),field('date','拜访日期','date',true),field('type','拜访方式','select',true,['现场拜访','线上会议','电话沟通','学术活动']),field('summary','沟通纪要','textarea',false,null,true),field('approvedTopic','经批准的讨论内容','textarea',false,null,true),field('nextFollowUp','后续跟进安排','textarea',false,null,true),field('compliant','已确认遵循公司合规要求','checkbox',true,null,true)]},
      profile:{title:'个人资料',fields:[field('name','姓名','text',true),field('region','负责区域'),field('role','岗位','text',false)]}
    };
    function openForm(type,id=null){formType=type;editing=id;const config=configs[type];if(!config)return;const entity=type==='profile'?state.profile:(state[type==='customer'?'customers':type==='project'?'projects':type==='task'?'tasks':'visits'].find(x=>x.id===id)||{});$('#modalTitle').textContent=(id?'编辑':'填写')+config.title;const fields=$('#formFields');fields.innerHTML=config.fields.map(f=>{const val=entity[f.name]??(f.name==='date'&&type==='task'?today():f.name==='date'&&type==='visit'?today():f.name==='priority'?'普通':f.name==='status'?'进行中':f.name==='progress'?0:'');let control='';if(f.type==='select'){const opts=typeof f.options==='function'?f.options():f.options.map(o=>[o,o]);control='<select name="'+f.name+'" '+(f.required?'required':'')+'><option value="">请选择</option>'+opts.map(o=>'<option value="'+escapeHtml(o[0])+'" '+(String(val)===String(o[0])?'selected':'')+'>'+escapeHtml(o[1])+'</option>').join('')+'</select>'}else if(f.type==='textarea'){control='<textarea name="'+f.name+'" placeholder="'+escapeHtml(f.placeholder)+'">'+escapeHtml(val)+'</textarea>'}else if(f.type==='checkbox'){control='<input type="checkbox" name="'+f.name+'" '+(f.required?'required ':'')+(val?'checked':'')+'>'}else{control='<input name="'+f.name+'" type="'+f.type+'" value="'+escapeHtml(val)+'" '+(f.required?'required':'')+(f.type==='number'?' min="0" max="100" step="1"':'')+' placeholder="'+escapeHtml(f.placeholder)+'">'}return '<div class="field '+(f.full?'full':'')+(f.type==='checkbox'?' checkbox':'')+'"><label>'+escapeHtml(f.label)+(f.required&&f.type!=='checkbox'?' *':'')+'</label>'+control+'</div>'}).join('');$('#modalBackdrop').classList.add('open');const first=fields.querySelector('input:not([type=checkbox]),select,textarea');if(first)setTimeout(()=>first.focus(),60)}
    function closeForm(){$('#modalBackdrop').classList.remove('open');formType=null;editing=null}
    function createId(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)}
    function saveForm(event){event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget).entries());configs[formType].fields.filter(f=>f.type==='checkbox').forEach(f=>data[f.name]=$('[name="'+f.name+'"]').checked);if(formType==='profile'){state.profile={...state.profile,...data}}else{const key={customer:'customers',project:'projects',task:'tasks',visit:'visits'}[formType];if(formType==='project')data.progress=Number(data.progress)||0;const rows=state[key];const index=rows.findIndex(x=>x.id===editing);if(index>=0)rows[index]={...rows[index],...data};else rows.unshift({id:createId(),...data,...(formType==='task'?{done:false}:{})})}save();closeForm();render();toast('已保存')}
    function removeRecord(type,id){if(!confirm('确定删除这条记录吗？'))return;const key={customer:'customers',project:'projects',task:'tasks',visit:'visits'}[type];state[key]=state[key].filter(x=>x.id!==id);save();render();toast('记录已删除')}
    document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
    $('#menuBtn').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#navBackdrop').classList.add('open')});$('#navBackdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#navBackdrop').classList.remove('open')});
    $('#profileBtn').addEventListener('click',()=>openForm('profile'));$('#quickBtn').addEventListener('click',()=>openForm(({customers:'customer',projects:'project',visits:'visit',tasks:'task',tasksAll:'task',calendar:'task'}[currentPage])||'task'));
    $('#closeModal').addEventListener('click',closeForm);$('#cancelModal').addEventListener('click',closeForm);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeForm()});$('#recordForm').addEventListener('submit',saveForm);
    $('#view').addEventListener('click',e=>{const add=e.target.closest('[data-add]');if(add){openForm(add.dataset.add);return}const go=e.target.closest('[data-goto]');if(go){setPage(go.dataset.goto);return}const edit=e.target.closest('[data-edit]');if(edit){const [type,id]=edit.dataset.edit.split(':');openForm(type,id);return}const del=e.target.closest('[data-delete]');if(del){const [type,id]=del.dataset.delete.split(':');removeRecord(type,id);return}const done=e.target.closest('[data-done]');if(done){const task=state.tasks.find(t=>t.id===done.dataset.done);if(task){task.done=!task.done;save();render();toast(task.done?'任务已完成':'任务已恢复为待办')}return}if(e.target.id==='exportBtn'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='智行工作台备份-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('备份已导出')}if(e.target.id==='importBtn')$('#importFile').click()});
    $('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!imported||!Array.isArray(imported.customers)||!Array.isArray(imported.tasks)||!Array.isArray(imported.projects)||!Array.isArray(imported.visits))throw Error();if(!confirm('导入会替换当前设备保存的工作台数据。继续吗？'))return;state={...emptyState,...imported,profile:{...emptyState.profile,...(imported.profile||{})}};save();render();toast('备份已导入')}catch{toast('文件格式不正确，未能导入')}finally{e.target.value=''}});
    $('#globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();const list=$('#recordList');if(list)list.querySelectorAll('.record').forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(q))});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
    render();
  </script>
</body>
